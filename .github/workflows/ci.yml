name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback lane: fmt/clippy are cheap and deterministic. Running them
  # in their own job lets them report red/green in parallel with the slower
  # build+test job instead of waiting behind a full `cargo build --workspace`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: t0
        id: t0
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: t1 (post-checkout)
        id: t1
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: t2 (post-toolchain)
        id: t2
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2
        id: rust_cache
      - name: t3 (post-cache-restore)
        id: t3
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: check workspace has crates
        id: has_crates
        run: |
          if [ -n "$(find . -mindepth 3 -maxdepth 3 -name Cargo.toml)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: fmt
        id: fmt
        if: steps.has_crates.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: t4 (post-fmt)
        id: t4
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: clippy
        id: clippy
        if: steps.has_crates.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: t5 (post-clippy)
        id: t5
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: timing summary
        if: always()
        run: |
          {
            echo "## CI timing telemetry — job \`lint\`"
            echo ""
            echo "| phase | seconds |"
            echo "|---|---|"
            echo "| checkout | $(( ${{ steps.t1.outputs.epoch }} - ${{ steps.t0.outputs.epoch }} )) |"
            echo "| toolchain setup | $(( ${{ steps.t2.outputs.epoch }} - ${{ steps.t1.outputs.epoch }} )) |"
            echo "| cache restore (rust-cache) | $(( ${{ steps.t3.outputs.epoch }} - ${{ steps.t2.outputs.epoch }} )) |"
            echo "| fmt --check | $(( ${{ steps.t4.outputs.epoch }} - ${{ steps.t3.outputs.epoch }} )) |"
            echo "| clippy | $(( ${{ steps.t5.outputs.epoch }} - ${{ steps.t4.outputs.epoch }} )) |"
            echo "| **total (checkout→clippy)** | **$(( ${{ steps.t5.outputs.epoch }} - ${{ steps.t0.outputs.epoch }} ))** |"
            echo ""
            echo "rust-cache cache-hit: \`${{ steps.rust_cache.outputs.cache-hit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Kept as job name `rust` — this is the required status check name on
  # `main` branch protection; renaming it would strand that required check.
  # build and test stay in the same job (not split further): fornax-daemon's
  # integration tests invoke sibling workspace binaries by their conventional
  # target/<profile>/<bin> path, so `cargo build --workspace` must run in the
  # same job, on the same runner filesystem, immediately before `cargo test`.
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: t0
        id: t0
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: t1 (post-checkout)
        id: t1
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: t2 (post-toolchain)
        id: t2
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2
        id: rust_cache
      - name: t3 (post-cache-restore)
        id: t3
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      # --- BEGIN sccache benchmark experiment (FORNX-237, temporary) ---
      # Installed via pinned `cargo install --locked` release rather than a
      # third-party GitHub Action, matching this repo's existing convention
      # for cargo-audit (no new action SHA to pin, docs/adr/0002).
      - name: install sccache
        id: sccache_install
        run: cargo install sccache --version 0.17.0 --locked
      - name: cache sccache dir
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/sccache
          key: v0-sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            v0-sccache-${{ runner.os }}-
      - name: t3b (post-sccache-setup)
        id: t3b
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      # --- END sccache benchmark experiment ---
      - name: check workspace has crates
        id: has_crates
        run: |
          if [ -n "$(find . -mindepth 3 -maxdepth 3 -name Cargo.toml)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: build workspace binaries
        id: build
        if: steps.has_crates.outputs.present == 'true'
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: /home/runner/.cache/sccache
        # Some integration tests (e.g. fornax-daemon's) invoke sibling
        # workspace binaries by their conventional target/<profile>/<bin>
        # path rather than CARGO_BIN_EXE_<name> (which Cargo only sets for
        # bins in the *same* crate as the test) — those binaries must exist
        # on disk before `cargo test` runs, same as local dev convention.
        run: cargo build --workspace
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: t4 (post-build)
        id: t4
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: test
        id: test
        if: steps.has_crates.outputs.present == 'true'
        run: cargo test --workspace
      - name: t5 (post-test)
        id: t5
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: timing summary
        if: always()
        run: |
          {
            echo "## CI timing telemetry — job \`rust\`"
            echo ""
            echo "| phase | seconds |"
            echo "|---|---|"
            echo "| checkout | $(( ${{ steps.t1.outputs.epoch }} - ${{ steps.t0.outputs.epoch }} )) |"
            echo "| toolchain setup | $(( ${{ steps.t2.outputs.epoch }} - ${{ steps.t1.outputs.epoch }} )) |"
            echo "| cache restore (rust-cache) | $(( ${{ steps.t3.outputs.epoch }} - ${{ steps.t2.outputs.epoch }} )) |"
            echo "| cargo build --workspace | $(( ${{ steps.t4.outputs.epoch }} - ${{ steps.t3.outputs.epoch }} )) |"
            echo "| cargo test --workspace | $(( ${{ steps.t5.outputs.epoch }} - ${{ steps.t4.outputs.epoch }} )) |"
            echo "| **total (checkout→test)** | **$(( ${{ steps.t5.outputs.epoch }} - ${{ steps.t0.outputs.epoch }} ))** |"
            echo ""
            echo "rust-cache cache-hit: \`${{ steps.rust_cache.outputs.cache-hit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Baseline PATCH_LOW_RISK-tier security check every higher risk tier also
  # inherits (docs/release-security-gate.md, FORNX-233). Installed via
  # `cargo install` from crates.io rather than a third-party GitHub Action,
  # so no new action SHA needs pinning (docs/adr/0002-repo-and-ci-conventions.md).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2
      - name: check workspace has crates
        id: has_crates
        run: |
          if [ -n "$(find . -mindepth 3 -maxdepth 3 -name Cargo.toml)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: install cargo-audit
        if: steps.has_crates.outputs.present == 'true'
        # Pinned to the exact version this job's local-equivalent
        # verification pass ran against (docs/release-security-gate.md,
        # "Validation") — cargo-audit's audit.toml config-path resolution
        # is version-sensitive, so an unpinned "latest" could silently
        # change which .cargo/audit.toml ignores are honored.
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: cargo audit
        if: steps.has_crates.outputs.present == 'true'
        run: cargo audit
